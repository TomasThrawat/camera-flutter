name: CircleCI Java Action Check
on:
  push:
    branches: [main]

jobs:
  check-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Java setup
        run: java -version
