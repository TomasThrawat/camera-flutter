name: Flutter Container Probe
on:
  push:
    branches: [main]

jobs:
  container-probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Capture build environment
        run: |
          {
            echo "user=$(id -un)"
            echo "flutter=$(command -v flutter || true)"
            flutter --version
            echo "java=$(command -v java || true)"
            java -version 2>&1 || true
            echo "ANDROID_HOME=\${ANDROID_HOME:-not-set}"
            echo "ANDROID_SDK_ROOT=\${ANDROID_SDK_ROOT:-not-set}"
            echo "sdkmanager=$(command -v sdkmanager || true)"
            echo "git=$(command -v git || true)"
            echo "pubspec_present=$(test -f pubspec.yaml && echo yes || echo no)"
          } > environment-report.txt 2>&1

      - name: Upload environment report
        uses: actions/upload-artifact@v4
        with:
          name: circleci-runner-environment
          path: environment-report.txt
          if-no-files-found: error
