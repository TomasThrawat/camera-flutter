name: CircleCI Runner Environment Probe
on:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Inspect runner tools without setup actions
        run: |
          {
            echo "=== OS ==="
            uname -a
            cat /etc/os-release || true
            echo "=== PATH TOOLS ==="
            command -v bash || true
            command -v curl || true
            command -v git || true
            command -v java || true
            command -v flutter || true
            command -v dart || true
            command -v sdkmanager || true
            echo "=== JAVA ==="
            java -version 2>&1 || true
            echo "=== DISK ==="
            df -h . || true
            echo "=== PROJECT ==="
            test -f pubspec.yaml && echo pubspec_present || echo pubspec_missing
            test -f lib/main.dart && echo main_dart_present || echo main_dart_missing
          } > environment-report.txt 2>&1
          cat environment-report.txt
      - name: Upload environment report
        uses: actions/upload-artifact@v4
        with:
          name: circleci-runner-environment
          path: environment-report.txt
          if-no-files-found: error
