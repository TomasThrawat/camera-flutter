name: Camera Flutter CI
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Camera ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Install Flutter and Android SDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils
          bash .circleci/install_android_flutter.sh

      - name: Apply verified Dart analyzer fixes
        run: python3 tool/fix_analyzer_warnings.py

      - name: Apply camera zoom and video controls
        run: python3 tool/patch_camera_features.py

      - name: Apply full-screen capture UI
        run: python3 tool/patch_camera_fullscreen_ui.py

      - name: Make camera preview fullscreen
        run: python3 tool/patch_fullscreen_camera_preview.py

      - name: Apply tap focus, gallery swipe, and inline video settings
        run: |
          set +e
          python3 tool/patch_camera_interactions.py 2>&1 | tee camera-interactions-patch.log
          patch_status=${PIPESTATUS[0]}
          printf '%s\n' "$patch_status" > camera-interactions-patch.exitcode
          exit 0

      - name: Upload camera interaction patch diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: camera-interaction-patch-diagnostics
          path: camera-interactions-patch.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify camera interaction patch
        run: |
          set -euo pipefail
          status="$(cat camera-interactions-patch.exitcode)"
          if [[ "$status" != "0" ]]; then
            echo "Camera interaction patch failed with exit code $status."
            exit "$status"
          fi

      - name: Prepare Android project and icon
        run: |
          set -euo pipefail
          bash tool/prepare_android.sh 2>&1 | tee -a camera-ci.log

      - name: Resolve Dart dependencies
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee -a camera-ci.log

      - name: Migrate photo_manager to built-in Kotlin for this CI build
        run: |
          set -euo pipefail
          python3 tool/patch_photo_manager_gradle.py 2>&1 | tee -a camera-ci.log

      - name: Generate launcher icons
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons 2>&1 | tee -a camera-ci.log

      - name: Format Dart source
        run: |
          set -euo pipefail
          dart format lib test 2>&1 | tee -a camera-ci.log

      - name: Analyze Flutter source
        run: |
          set -euo pipefail
          flutter analyze --no-pub --fatal-infos 2>&1 | tee -a camera-ci.log

      - name: Run widget tests
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee -a camera-ci.log

      - name: Build ARM64 release APK
        run: |
          set -euo pipefail
          flutter build apk --no-pub --release --target-platform android-arm64 2>&1 | tee -a camera-ci.log

      - name: Upload complete build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: camera-build-diagnostics
          path: camera-ci.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ARM64 APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: camera-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
