name: Camera Flutter CI
on:
  push:
    branches: [main]

jobs:
  build-android:
    name: Build Camera ARM64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Android project and launcher icon
        run: bash tool/prepare_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run widget tests
        run: flutter test --reporter expanded

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: camera-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
