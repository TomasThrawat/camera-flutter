name: CircleCI Runner Probe
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Verify runner and checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify Flutter project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "CircleCI workflow runner checked out camera-flutter."
          git rev-parse --short HEAD
