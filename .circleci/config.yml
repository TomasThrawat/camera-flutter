name: Camera Flutter CI
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Camera ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Install Flutter and Android SDK
        run: bash .circleci/install_android_flutter.sh

      - name: Apply verified Dart analyzer fixes
        run: python3 tool/fix_analyzer_warnings.py

      - name: Prepare Android project and icon
        run: |
          set -euo pipefail
          bash tool/prepare_android.sh 2>&1 | tee -a camera-ci.log

      - name: Resolve Dart dependencies
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee -a camera-ci.log

      - name: Generate launcher icons
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons 2>&1 | tee -a camera-ci.log

      - name: Format Dart source
        run: |
          set -euo pipefail
          dart format lib test 2>&1 | tee -a camera-ci.log

      - name: Analyze Flutter source
        run: |
          set -euo pipefail
          flutter analyze --fatal-infos 2>&1 | tee -a camera-ci.log

      - name: Run widget tests
        run: |
          set -euo pipefail
          flutter test --reporter expanded 2>&1 | tee -a camera-ci.log

      - name: Build ARM64 release APK
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee -a camera-ci.log

      - name: Upload complete build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: camera-build-diagnostics
          path: camera-ci.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ARM64 APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: camera-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
