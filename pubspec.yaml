name: black_camera
description: Minimal Flutter camera app for photo, video, and a local gallery.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  photo_manager: ^3.12.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/camera_app_icon.png
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/camera_app_icon.png
  min_sdk_android: 24
